name: bcq-g3-process-recovery
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/test-bcq-recovery.sh'
      - 'scripts/test-bcq-035-migration.sh'
      - 'scripts/test-bcq-g42-ledger-privileges.sh'
      - 'scripts/test-bcq-g42-pitr.sh'
      - 'scripts/test-bcq-g42-populated-upgrade.sh'
      - 'scripts/sql/**'
      - '.github/workflows/bcq-g3-process-recovery.yml'
  workflow_dispatch:
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check BCQ-035 PostgreSQL additive migration and replay
        run: bash scripts/test-bcq-035-migration.sh
      - name: Stage populated pre-upgrade DB and run G4+G4.2 SQL migrations with restricted runtime validate
        run: bash scripts/test-bcq-g42-populated-upgrade.sh
      - name: Apply G4.2 PostgreSQL ledger migration and prove runtime privileges
        run: bash scripts/test-bcq-g42-ledger-privileges.sh
      - name: Force Java process crash, read same PostgreSQL, restore backup
        run: bash scripts/test-bcq-recovery.sh
      - name: Qualify archived WAL PITR target and measure isolated recovery time
        run: bash scripts/test-bcq-g42-pitr.sh
      - name: G4.2-E prove real PostgreSQL COMMIT acknowledged by server but dropped before client
        run: mvn -B --no-transfer-progress -Dtest=PostgresCommitAckLossProtocolTest test
