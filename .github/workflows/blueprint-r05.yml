name: blueprint-r05
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'scripts/test-blueprint-core.sh'
      - '.github/workflows/blueprint-r05.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pure Java Blueprint verification
        run: bash scripts/test-blueprint-core.sh
      - name: JPA/PostgreSQL Save-Reopen-Impact regression
        run: mvn -B --no-transfer-progress verify
      - name: Print measured JaCoCo coverage for business core
        run: python3 scripts/report-coverage.py target/site/jacoco/jacoco.xml
