name: catalog-smoke

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/main/java/kz/zavod/catalog/**'
      - 'src/test/java/kz/zavod/catalog/**'
      - 'scripts/test-catalog.sh'
      - '.github/workflows/catalog-smoke.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run equipment catalog checks
        run: bash scripts/test-catalog.sh
