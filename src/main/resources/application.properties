# Development only. Production schema changes require an approved migration process.
spring.application.name=zavod-blueprint
spring.datasource.url=${ZAVOD_DB_URL:jdbc:postgresql://localhost:5432/zavod}
spring.datasource.username=${ZAVOD_DB_USER:zavod}
spring.datasource.password=${ZAVOD_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
